<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glass Calendar</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/bootstrap5/main.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js'></script>
  <style>
    body {
      padding-top: 20%;
      background-color: #000; /* Full black background */
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #calendar {
      width: 90%;
      max-width: 1000px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      box-shadow: 0 4px 30px rgba(0, 255, 128, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 255, 128, 0.1);
      padding: 20px;
    }

    .fc {
      color: #21E6C1;
    }

    .fc .fc-toolbar-title {
      font-size: 2rem;
      color: #21E6C1;
    }

    .fc .fc-button {
      background-color: #21E6C1;
      border: none;
      color: #000;
      font-weight: bold;
      border-radius: 10px;
      transition: 0.2s;
    }

    .fc .fc-button:hover {
      background-color: #278EA5;
    }

    .fc-day-today {
      background-color: rgba(33, 230, 193, 0.2) !important;
    }

    .fc-event {
      background-color: #21E6C1 !important;
      color: black !important;
      border-radius: 10px;
      padding: 2px 4px;
      font-weight: 500;
      border: none;
    }

    .fc-scrollgrid {
      border: none !important;
    }
  </style>
</head>
<body>

  <div id="calendar"></div>

  
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const calendarEl = document.getElementById('calendar');
      const calendar = new FullCalendar.Calendar(calendarEl, {
        themeSystem: 'bootstrap5',
        initialView: 'dayGridMonth',
      });
      calendar.render();
    });
    
  </script>

</body>
</html>
