<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glass Calendar with Sidebar</title>

  <!-- Bootstrap and FullCalendar CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/bootstrap5/main.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">

  <!-- FullCalendar JS -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #000;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar styles */
    #sidebar {
      height: 100vh;
      width: 250px;
      transition: all 0.3s;
    }

    #sidebar.collapsed {
      width: 70px;
    }

    #sidebar .nav-link {
      color: #21E6C1;
      transition: all 0.2s;
    }

    #sidebar .nav-link:hover {
      background-color: #25c085;
    }

    #sidebar.collapsed .link-text {
      display: none;
    }

    #toggle-btn {
      background-color: #278EA5;
      color: white;
      border: none;
      margin: 10px;
      padding: 8px 12px;
      border-radius: 8px;
    }

    /* Calendar container */
    #calendar-container {
      flex-grow: 1;
      padding: 30px;
      overflow-y: auto;
    }

    #calendar {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      box-shadow: 0 4px 30px rgba(0, 255, 128, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 255, 128, 0.1);
      padding: 20px;
      height: 80%;
    }

    /* FullCalendar customization */
    .fc {
      color: #21E6C1;
    }

    .fc .fc-toolbar-title {
      font-size: 2rem;
      color: #21E6C1;
    }

    .fc .fc-button {
      background-color: #21E6C1;
      border: none;
      color: #000;
      font-weight: bold;
      border-radius: 10px;
      transition: 0.2s;
    }

    .fc .fc-button:hover {
      background-color: #278EA5;
    }

    .fc-day-today {
      background-color: rgba(33, 230, 193, 0.2) !important;
    }

    .fc-event {
      background-color: #21E6C1 !important;
      color: black !important;
      border-radius: 10px;
      padding: 2px 4px;
      font-weight: 500;
      border: none;
    }

    .fc-scrollgrid {
      border: none !important;
    }

    .fc-day-grid-container.fc-scroller {
      height: auto!important;
      overflow-y: auto;
    }

    .modal-content {
      background: rgba(180, 180, 180, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 15px;
      color: #fff;
    }
  </style>
</head>
<body>

<div class="d-flex">
  <!-- Sidebar -->
  <div id="sidebar" class="d-flex flex-column p-3">
    <button id="toggle-btn">☰</button>
    <ul class="nav nav-pills flex-column mb-auto mt-3">
      <li class="nav-item">
        <a href="#" class="nav-link">
          <span class="me-2">🏠</span>
          <span class="link-text">Home</span>
        </a>
      </li>
      <li>
        <a href="#" class="nav-link" data-bs-toggle="modal" data-bs-target="#addTaskModal">
          <span class="me-2">➕</span>
          <span class="link-text">Add Task</span>
        </a>
      </li>
      <li>
        <a href="#" class="nav-link">
          <span class="me-2">📊</span>
          <span class="link-text">Reports</span>
        </a>
      </li>
      <li>
        <a href="#" class="nav-link">
          <span class="me-2">⚙️</span>
          <span class="link-text">Settings</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Calendar Area -->
  <div id="calendar-container">
    <div id="calendar"></div>
  </div>
</div>

<!-- Add Task Modal -->
<div class="modal fade" id="addTaskModal" tabindex="-1" aria-labelledby="addTaskModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content text-white">
      <div class="modal-header">
        <h5 class="modal-title" id="addTaskModalLabel">Add New Task</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="taskForm">
          <div class="mb-3">
            <label for="taskTitle" class="form-label">Task Title</label>
            <input type="text" class="form-control bg-dark text-white" id="taskTitle" required>
          </div>
          <div class="mb-3">
            <label for="taskDate" class="form-label">Date</label>
            <input type="date" class="form-control bg-dark text-white" id="taskDate" required>
          </div>
          <div class="mb-3">
            <label for="taskTime" class="form-label">Date</label>
            <input type="time" class="form-control bg-dark text-white" id="taskTime" required>
          </div>
          <div class="mb-3">
            <label for="taskDesc" class="form-label">Description</label>
            <textarea class="form-control bg-dark text-white" id="taskDesc" rows="3"></textarea>
          </div>
          <button type="submit" class="btn" style="background-color:#21E6C1; color:#000;">Add Task</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const calendarEl = document.getElementById('calendar');
    const calendar = new FullCalendar.Calendar(calendarEl, {
      themeSystem: 'bootstrap5',
      initialView: 'dayGridMonth',
    });
    calendar.render();

    const toggleBtn = document.getElementById('toggle-btn');
    const sidebar = document.getElementById('sidebar');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
    });

    
  });
</script>

<!-- ✅ Bootstrap Bundle JS (includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
