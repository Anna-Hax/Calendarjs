<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Credential Entry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../public/static/info.css" rel="stylesheet">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="form-container col-md-6">
            <h3 class="text-center mb-4">Info</h3>
            <form id="form-admin-info">
                <div class="mb-3">
                    <label for="name" class="form-label"></label>
                    <input type="text" class="form-control" id="name" placeholder="Enter Name" required>
                </div>
                <div class="mb-3">
                    <label for="email-option" class="form-label"> The email with which you logged in with is for:</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="email-option" id="personal">
                        <label class="form-check-label" for="personal">Personal</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="email-option" id="work">
                        <label class="form-check-label" for="work">Work</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="email-option" id="both">
                        <label class="form-check-label" for="both">Both</label>
                    </div>
                </div>
                <div id="div">

                </div>
                
                <button type="submit" class="btn btn-primary w-100" id="submitBtn">Get Started!</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../public/script/info.js"></script>
</body>
</html>
